<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>DWA Selfie Verification</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family:
        Arial,
        sans-serif;

      background:
        #f4f6f8;

      margin: 0;

      padding: 20px;

      text-align: center;

    }


    .container {

      max-width: 560px;

      margin: auto;

      background: white;

      padding: 25px;

      border-radius: 18px;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,0.08);

    }


    h1 {

      font-size: 28px;

      margin:
        0 0 5px 0;

    }


    .subtitle {

      color: #666;

      margin-bottom: 20px;

    }


    #status {

      padding: 14px;

      margin-bottom: 15px;

      background: #f1f3f5;

      border-radius: 10px;

      font-size: 15px;

    }


    #camera {

      width: 100%;

      max-width: 500px;

      border-radius: 14px;

      background: #111;

      display: none;

      transform:
        scaleX(-1);

    }


    #preview {

      width: 100%;

      max-width: 500px;

      border-radius: 14px;

      display: none;

    }


    canvas {

      display: none;

    }


    button {

      width: 100%;

      max-width: 500px;

      padding: 15px;

      margin-top: 12px;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      color: white;

    }


    #startCamera {

      background:
        #198754;

    }


    #takePhoto {

      background:
        #0d6efd;

      display: none;

    }


    #retakePhoto {

      background:
        #6c757d;

      display: none;

    }


    #sendPhoto {

      background:
        #212529;

      display: none;

    }


    #successBox {

      display: none;

      margin-top: 15px;

      padding: 18px;

      border-radius: 12px;

      background:
        #e8f5e9;

      color:
        #198754;

      font-weight: bold;

    }


    .info {

      margin-top: 15px;

      padding: 12px;

      background:
        #f8f9fa;

      border-radius: 10px;

      font-size: 13px;

      color: #666;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    DAILY WORK ATTENDANCE
  </h1>


  <div class="subtitle">
    Selfie Verification
  </div>


  <div id="status">

    Kamera belum dimulai.

  </div>


  <!-- CAMERA -->

  <video
    id="camera"
    autoplay
    playsinline>
  </video>


  <!-- CANVAS -->

  <canvas
    id="canvas">
  </canvas>


  <!-- PREVIEW -->

  <img
    id="preview"
    alt="Selfie Preview">


  <!-- START CAMERA -->

  <button
    id="startCamera"
    onclick="startCamera()">

    📷 Buka Kamera

  </button>


  <!-- TAKE PHOTO -->

  <button
    id="takePhoto"
    onclick="takePhoto()">

    📸 Ambil Selfie

  </button>


  <!-- RETAKE -->

  <button
    id="retakePhoto"
    onclick="retakePhoto()">

    🔄 Ambil Ulang

  </button>


  <!-- SEND -->

  <button
    id="sendPhoto"
    onclick="sendPhoto()">

    ✅ Gunakan Selfie

  </button>


  <div
    id="successBox">

    ✅ Selfie berhasil dikirim ke DWA.

    <br><br>

    Anda dapat menutup halaman ini.

  </div>


  <div class="info">

    Pastikan wajah terlihat jelas
    sebelum mengambil selfie.

  </div>


</div>



<script>


/* ==========================================
 * VARIABLES
 * ========================================== */

let cameraStream = null;

let capturedImage = null;


const video =
  document.getElementById(
    'camera'
  );


const canvas =
  document.getElementById(
    'canvas'
  );


const preview =
  document.getElementById(
    'preview'
  );


const status =
  document.getElementById(
    'status'
  );


const startButton =
  document.getElementById(
    'startCamera'
  );


const takeButton =
  document.getElementById(
    'takePhoto'
  );


const retakeButton =
  document.getElementById(
    'retakePhoto'
  );


const sendButton =
  document.getElementById(
    'sendPhoto'
  );


const successBox =
  document.getElementById(
    'successBox'
  );



/* ==========================================
 * START CAMERA
 * ========================================== */

async function startCamera() {


  status.innerText =
    '⏳ Meminta izin kamera...';


  try {


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              'user',

            width: {

              ideal: 1280

            },

            height: {

              ideal: 720

            }

          },

          audio: false

        });


    video.srcObject =
      cameraStream;


    video.style.display =
      'block';


    startButton.style.display =
      'none';


    takeButton.style.display =
      'block';


    status.innerText =
      '📷 Kamera aktif. Silakan ambil selfie.';


  }

  catch (error) {


    console.error(
      error
    );


    status.innerText =
      '❌ Kamera gagal dibuka: ' +
      error.message;

  }

}



/* ==========================================
 * TAKE PHOTO
 * ========================================== */

function takePhoto() {


  if (!cameraStream) {


    status.innerText =
      '❌ Kamera belum aktif.';


    return;

  }


  /*
   * Ambil ukuran video asli
   */

  let sourceWidth =
    video.videoWidth;


  let sourceHeight =
    video.videoHeight;


  /*
   * Ukuran maksimum foto
   */

  const maxWidth =
    640;


  const maxHeight =
    480;


  /*
   * Hitung ratio
   */

  const ratio =
    Math.min(

      maxWidth /
        sourceWidth,

      maxHeight /
        sourceHeight,

      1

    );


  /*
   * Ukuran final
   */

  const finalWidth =
    Math.round(
      sourceWidth *
      ratio
    );


  const finalHeight =
    Math.round(
      sourceHeight *
      ratio
    );


  canvas.width =
    finalWidth;


  canvas.height =
    finalHeight;


  const context =
    canvas.getContext(
      '2d'
    );


  /*
   * Mirror selfie
   * supaya hasil foto seperti kamera depan
   */

  context.save();


  context.translate(
    finalWidth,
    0
  );


  context.scale(
    -1,
    1
  );


  context.drawImage(

    video,

    0,
    0,

    finalWidth,
    finalHeight

  );


  context.restore();


  /*
   * Compress JPEG
   *
   * Quality 0.70
   */

  capturedImage =
    canvas.toDataURL(

      'image/jpeg',

      0.70

    );


  /*
   * Preview
   */

  preview.src =
    capturedImage;


  preview.style.display =
    'block';


  video.style.display =
    'none';


  takeButton.style.display =
    'none';


  retakeButton.style.display =
    'block';


  sendButton.style.display =
    'block';


  status.innerText =
    '✅ Selfie berhasil diambil. Periksa foto sebelum digunakan.';

}



/* ==========================================
 * RETAKE
 * ========================================== */

function retakePhoto() {


  capturedImage =
    null;


  preview.style.display =
    'none';


  video.style.display =
    'block';


  takeButton.style.display =
    'block';


  retakeButton.style.display =
    'none';


  sendButton.style.display =
    'none';


  status.innerText =
    '📷 Silakan ambil selfie kembali.';

}



/* ==========================================
 * SEND PHOTO TO APPS SCRIPT
 * ========================================== */

function sendPhoto() {


  if (!capturedImage) {


    status.innerText =
      '❌ Foto belum tersedia.';


    return;

  }


  /*
   * Pastikan halaman ini
   * memang dibuka dari DWA
   */

  if (!window.opener) {


    status.innerText =
      '❌ Halaman DWA tidak ditemukan. Buka kamera dari aplikasi DWA.';


    return;

  }


  /*
   * Matikan kamera
   */

  stopCamera();


  /*
   * Disable tombol
   */

  sendButton.disabled =
    true;


  retakeButton.disabled =
    true;


  status.innerText =
    '⏳ Mengirim selfie ke DWA...';


  /*
   * Kirim ke halaman Apps Script
   */

  try {


    window.opener.postMessage(

      {

        type:
          'SELFIE_CAPTURED',

        imageData:
          capturedImage

      },

      '*'

    );


    /*
     * Berhasil dikirim
     */

    status.innerText =
      '✅ Selfie berhasil dikirim ke DWA.';


    successBox.style.display =
      'block';


    sendButton.style.display =
      'none';


    retakeButton.style.display =
      'none';


  }

  catch (error) {


    console.error(
      error
    );


    sendButton.disabled =
      false;


    retakeButton.disabled =
      false;


    status.innerText =
      '❌ Gagal mengirim selfie: ' +
      error.message;

  }

}



/* ==========================================
 * STOP CAMERA
 * ========================================== */

function stopCamera() {


  if (!cameraStream) {

    return;

  }


  cameraStream
    .getTracks()
    .forEach(

      function(track) {

        track.stop();

      }

    );


  cameraStream =
    null;

}



/* ==========================================
 * PAGE CLOSE
 * ========================================== */

window.addEventListener(
  'beforeunload',
  function() {

    stopCamera();

  }
);


</script>


</body>

</html>
